<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <rect width="100" height="120" fill="#ae0714"/>
  <!-- Brazo horizontal -->
  <path d="M20 50 L80 50" 
        stroke="white" 
        stroke-width="12" 
        stroke-linecap="round"/>
  <!-- Parte superior del poste vertical -->
  <path d="M50 20 L50 50" 
        stroke="white" 
        stroke-width="12" 
        stroke-linecap="round"/>
  <!-- Parte inferior del poste vertical (más larga) -->
  <path d="M50 50 L50 100" 
        stroke="white" 
        stroke-width="12" 
        stroke-linecap="round"/>
</svg>
